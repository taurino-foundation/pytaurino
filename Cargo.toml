[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Ari Bermeki"]
license = "MIT OR Apache-2.0"
homepage = "https://taurino.app/"
repository = "https://github.com/taurino-apps/taurino"

[workspace]
resolver = "3"
members = [
  "crates/taurino",
  "crates/taurino-aio",
  "crates/taurino-config",
  "crates/taurino-core",
  "crates/taurino-engine",
]


[workspace.dependencies]
taurino-aio = { path = "./crates/taurino-aio" }
taurino-config = { path = "./crates/taurino-config" }
taurino-core = { path = "./crates/taurino-core" }
taurino-engine = { path = "./crates/taurino-engine" }
wry = { version = "0.57.0", default-features = false, features = [
  "os-webview",
  "linux-body",
] }
tao = { version = "0.37.0", default-features = false, features = ["rwh_06", "serde"] }
url = { version = "2", features = ["serde"]  }
dpi = { version = "0.1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
http = "1"
regex = "1"
log = "0.4.21"
getrandom = { version = "0.4", features = ["std"] }
anyhow = "1.0.91"
pyo3 = {version = "=0.29", default-features = false, features = ["abi3-py310","anyhow","bytes","extension-module","generate-import-lib","macros"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }

# [features]
# default = ["x11","dbus"]
# x11 = ["tao/x11","wry/x11"]
# dbus = ["tao/dbus"]
# common-controls-v6 = ["windows/Win32_UI_Controls","windows/Win32_UI_Shell"]




# Standard-Release-Profil: klein & optimiert
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true

# Dev-Profil-Anpassung für schnellere Build-Tools
[profile.dev.package.miniz_oxide]
opt-level = 3

# Aggressiveres Profil für maximale Größenreduktion
[profile.release-size-optimized]
inherits = "release"
opt-level = "z"
codegen-units = 1
lto = "fat"
incremental = false
panic = "abort"
strip = "symbols"



# [workspace.lints.rust]
# unsafe_code = "warn"
# missing_docs = "warn"

[workspace.lints.clippy]
# TODO: Update in next PR to keep changes small, see https://github.com/tauri-apps/tauri/pull/16029
collapsible_if = "allow"

redundant_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"
