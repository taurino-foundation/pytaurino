name: Compile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-2025

          # macOS Intel / x86_64
          - target: x86_64-apple-darwin
            os: macos-15-intel

          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Linux benötigt GTK/WebKit-Systembibliotheken für Tauri.
      - name: Install Linux dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Rust target
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}

      # Cargo.lock an Cargo.toml / Dependencies anpassen.
      - name: Update Cargo.lock
        shell: bash
        run: |
          cargo update

      - name: Cargo check
        shell: bash
        run: |
          cargo check \
            --locked \
            --all-targets \
            --target ${{ matrix.target }}

      - name: Compile tests
        shell: bash
        run: |
          cargo test \
            --locked \
            --no-run \
            --target ${{ matrix.target }}
