
# SPDX-License-Identifier: MIT OR Apache-2.0

# =============================================================================
# Build System
# =============================================================================

[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"


# =============================================================================
# Project Metadata
# =============================================================================

[project]
name = "taurino"
dynamic = ["version"]

description = "An asynchronous, cross-platform desktop GUI framework for Python, powered by Rust, Tao, and Wry."
readme = "README.md"
requires-python = ">=3.11,<3.15"

license = "MIT OR Apache-2.0"
license-files = [
    "LICENSE-MIT",
    "LICENSE-APACHE-2.0",
]

keywords = [
    "asyncio",
    "desktop",
    "gui",
    "ipc",
    "pyo3",
    "rust",
    "tao",
    "tokio",
    "webview",
    "wry",
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",

    "Intended Audience :: Developers",

    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",

    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",

    "Typing :: Typed",
]

dependencies = [
    "msgpack>=1.1,<2",
    "numpy>=2.4.6",
    "pydantic>=2.11,<3",
    "taunicorn>=0.1.9,<0.2",
]


# =============================================================================
# Project URLs
# =============================================================================

[project.urls]
Homepage = "https://github.com/taurino-foundation/taurino"
Repository = "https://github.com/taurino-foundation/taurino"
Issues = "https://github.com/taurino-foundation/taurino/issues"


# =============================================================================
# Development Dependencies - PEP 735
# =============================================================================

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

lint = [
    "ruff>=0.17.0,<1",
]

test = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
]


# =============================================================================
# Maturin / PyO3
# =============================================================================

[tool.maturin]
manifest-path = "crates/taurino/Cargo.toml"
bindings = "pyo3"
module-name = "taurino.core._taurino"
strip = true


# =============================================================================
# Ruff - Global Settings
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

# Keep the same stable formatting behavior across platforms.
preview = false

# =============================================================================
# Ruff - Linter
# =============================================================================

[tool.ruff.lint]
select = [
    "E4",     # Import errors
    "E7",     # Statement errors
    "E9",     # Runtime and syntax errors
    "F",      # Pyflakes
    "I",      # Import sorting
    "B",      # Bugbear
    "BLE",    # Blind exception handling
    "UP",     # Modern Python syntax
]

# Enforce the configured maximum line length.
extend-select = ["E501"]

# Avoid automatically applying fixes that could change behavior.
unfixable = [
    "B",
    "BLE",
]

[tool.ruff.lint.isort]
known-first-party = ["taurino"]
combine-as-imports = true

# =============================================================================
# Ruff - Formatter
# =============================================================================

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"


# =============================================================================
# Pytest / AsyncIO
# =============================================================================

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]


addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

xfail_strict = true
