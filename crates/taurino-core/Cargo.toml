[package]
name = "taurino-core"
version = "0.1.0"
edition = "2024"


[dependencies]
anyhow.workspace = true
wry.workspace = true
tao.workspace = true
log.workspace = true
serde_json.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
os_info = "3.15.0"

[lints]
workspace = true





# ─────────────────────────────────────────────
# Windows
# ─────────────────────────────────────────────

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation","Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_System_WinRT", "Win32_Security","Win32_UI", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
softbuffer = { version = "0.4.8", default-features = false }
once_cell = "1.21.4"
webview2-com = "0.39.1"


# ─────────────────────────────────────────────
# macOS
# ─────────────────────────────────────────────

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"

objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSApplication",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSScreen",
    "NSGraphics",
    "NSColor",
    "NSImage",
] }

objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKContentWorld",
    "WKFrameInfo",
    "WKScriptMessage",
    "WKScriptMessageHandlerWithReply",
    "WKUserContentController",
] }

security-framework = "3.7.0"
x509-parser = "0.18.1"
x-win = "5.8.0"
# ─────────────────────────────────────────────
# Linux / BSD
# ─────────────────────────────────────────────


[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = {version = "0.18",features = ["v3_24"]}
webkit2gtk = {version = "=2.0",features = ["v2_40"]}




# Desktop only
[target.'cfg(any(target_os = "linux",target_os = "dragonfly",target_os = "freebsd",target_os = "openbsd",target_os = "netbsd",target_os = "windows",target_os = "macos"))'.dependencies]
muda = {version = "0.20",default-features = false,features = ["serde","gtk3"]}
tray-icon = {version = "0.25",default-features = false,features = ["serde","libappindicator"]}
